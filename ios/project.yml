name: Transcriber
options:
  bundleIdPrefix: com.erankaufman
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: DHSWZ6F8C2
packages:
  TranscriberCore:
    path: TranscriberCore
targets:
  Transcriber:
    type: application
    platform: iOS
    sources: [Transcriber]
    dependencies:
      - package: TranscriberCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erankaufman.transcriber
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Transcriber records your voice notes so they can be transcribed."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID keeps your note history private."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Transcriber/Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
