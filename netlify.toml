# continuous deployment from github.com/erakauf1/transcriber (main branch)
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.openai.com https://api.anthropic.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:"
